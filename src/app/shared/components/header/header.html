<!-- Mobile Header -->
<header class="flex items-center justify-between border-b border-slate-200 bg-white px-4 py-4 lg:hidden">

  <h1 class="text-lg font-bold tracking-tight text-slate-900">
    Personal Task Manager
  </h1>

  <button
    type="button"
    class="rounded-lg p-2 text-slate-600 bg-slate-300 transition hover:bg-slate-500"
    aria-label="Open menu"
    (click)="openMenu()"
  >
    ☰
  </button>

</header>

<!-- Desktop Header -->
<header class="hidden border-b border-slate-200 bg-white lg:block">

  <div class="flex h-20 items-center justify-between px-8">

    <div>
      <p class="text-sm text-slate-500">
        Personal Workspace
      </p>

      <h2 class="text-lg font-semibold text-slate-900">
        Dashboard
      </h2>
    </div>

    <button
      type="button"
      class="rounded-lg border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:bg-slate-50"
    >
      I Don't Known
    </button>

  </div>

</header>
